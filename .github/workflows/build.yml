name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Uploaded Zip File
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "No zip file found!"
          exit 1
        fi
        unzip -o "$ZIP_FILE"
        if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
          SUBDIR=$(find . -maxdepth 2 -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
            cp -r $SUBDIR/* .
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make Gradlew Executable
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Compile and Build Android APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Samsung-GalaxyA14-AppLock-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
