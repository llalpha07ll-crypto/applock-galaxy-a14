name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project Zip from Any Folder
      run: |
        echo "Searching for uploaded zip file..."
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "ERROR: Repository me koi bhi .zip file nahi mili!"
          exit 1
        fi
        echo "Found zip file at: $ZIP_FILE. Extracting..."
        unzip -o "$ZIP_FILE" -d .

        if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
          SUBDIR=$(find . -maxdepth 2 -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
            cp -r $SUBDIR/* .
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Fix Gradle Config & Missing Mipmap Resources
      run: |
        # 1. Root build.gradle.kts version fix
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # 2. Settings.gradle.kts repository configuration
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AppLockPro"
        include(":app")
        EOF

        # 3. Create missing mipmap icons so AAPT2 links cleanly
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/glass_badge_bg"/>
            <foreground android:drawable="@drawable/ic_fingerprint_vector"/>
        </adaptive-icon>
        EOF
        cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

        # 4. Proguard rules file
        touch app/proguard-rules.pro

        # 5. Wrapper jar download if missing
        mkdir -p gradle/wrapper
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
        fi
        chmod +x gradlew

    - name: Set up Gradle Action
      uses: gradle/actions/setup-gradle@v3

    - name: Compile and Build Android APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Samsung-GalaxyA14-AppLock-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
